        <h1>Qorvena: never miss an appointment</h1>
        <p>Qorvena is an appointment management web app. Add an appointment once and get an email confirmation now and a friendly reminder just before it starts.</p>
        <ul>
          <li>Pick the date and time</li>
          <li>Get an email confirmation</li>
          <li>Get reminded on time</li>
        </ul>
        <h2>What QORVENA stands for</h2>
        <p>QORVENA is an original coined name inspired by the Latin word Vena, meaning &ldquo;vein.&rdquo; It symbolizes the continuous flow of information and coordination within the system. Just as veins connect different parts of the body, QORVENA connects appointment requests, scheduling processes, and automated notifications in one centralized platform, making appointment management more organized, efficient, and convenient.</p>
        <p>Please turn on JavaScript to sign in and manage your appointments.</p>
